media: assets
content:
  - name: pages
    label: Pages
    type: collection
    path: pages
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Publish Date
        type: date
      - name: body
        label: Content
        type: rich-text
      - name: related_page
        type: reference
        options:
          collection: pages
          search: "name,fields.body"