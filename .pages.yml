media: assets
content:
  - name: pages
    label: Pages
    type: collection
    path: pages
    filename: 
      template: "{{title | slugify }}.md"
      field: true
    view:
      fields: [title, __filename, date]
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Publish Date
        type: date
      - name: body
        label: Content
        type: rich-text